version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: shiftshield_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shiftshield_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: .
    container_name: shiftshield_backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/shiftshield_db?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    depends_on:
      - db

  # Frontend runs on Node/Vite in dev, but can be built as static. 
  # For simple compose we can run it using a node container.
  frontend:
    image: node:20-alpine
    container_name: shiftshield_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  db_data:
